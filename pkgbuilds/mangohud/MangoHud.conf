### omarchy-gaming opinionated defaults for MangoHud.
### This is the system-wide fallback (/etc/MangoHud.conf), overridden by any
### per-user config at ~/.config/MangoHud/MangoHud.conf or a per-app one.
### See `mangohud --help` or `man mangohud` for the full list of options.

### Core performance readout
fps
frametime
frame_timing
throttling_status

### CPU / GPU stats
cpu_stats
cpu_temp
gpu_stats
gpu_temp

### Memory
ram
vram

### Flag when GameMode or vkBasalt are active for this process
gamemode
vkbasalt

### Layout
position=top-left
background_alpha=0.4
round_corners=6
toggle_hud=Shift_R+F12
