; omarchy-gaming opinionated defaults for GameMode.
; See `man gamemode.ini` for the full list of options.

[general]
; Use "performance" while gaming, drop back to "powersave" once the game exits
desiredgov=performance
defaultgov=powersave

; Only push the iGPU governor to "performance" once it's actually under load
igpu_desiredgov=powersave
igpu_power_threshold=0.3

; Renice game processes; requires the user to be a member of the `gamemode` group
renice=10

inhibit_screensaver=1
disable_splitlock=1

[cpu]
; Auto-detect hybrid/X3D CPUs and pin games to the fast cores
pin_cores=yes

[gpu]
; Opt in per-host if you want GPU overclock optimisations applied
;apply_gpu_optimisations=accept-responsibility
