# omarchy-gaming: raise the memory-map ceiling.
# Some modern titles (e.g. Baldur's Gate 3, Diablo IV, Starfield) running under
# Proton/DXVK/VKD3D create far more memory mappings than the kernel default
# (65530) allows, and fail to start or crash under memory pressure without this.
vm.max_map_count = 2147483642
