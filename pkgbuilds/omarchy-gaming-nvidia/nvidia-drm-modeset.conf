# omarchy-gaming: enable DRM kernel mode-setting on the NVIDIA driver.
# Required for Wayland compositors (Hyprland) to drive the GPU directly,
# for smooth VT switching/suspend, and for G-SYNC. fbdev=1 gives a native
# framebuffer console instead of falling back to simpledrm/efifb.
options nvidia-drm modeset=1 fbdev=1
