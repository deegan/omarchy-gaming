server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    # bin/publish generates index.html as a landing page; autoindex is just
    # the fallback for browsing subpaths that don't have one (and for before
    # the first publish).
    index index.html;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }
}
